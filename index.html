<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>時計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght=700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

#forceBg {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: -1;
}

html, body {
  background: #000 !important;
  color: #fff;
  width: 100%;
  min-height: 100vh;
  font-family: 'Zen Kaku Gothic New', -apple-system, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
}

/* ===============================
   時計エリア
=============================== */
#clock {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  padding: 4vw 3vw 2vw;
  width: 100%;
}

@media (orientation: landscape) {
  #clock {
    min-height: 100vh;
    height: 100vh;
    padding: 2vh 4vw;
  }
}

#timeDisplay {
  font-family: 'Zen Kaku Gothic New', monospace;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  line-height: 1;
  width: 100%;
  text-align: center;
  font-size: 10px;
}

#secDisplay {
  font-family: 'Zen Kaku Gothic New', monospace;
  font-weight: 700;
  color: #444;
  white-space: nowrap;
  line-height: 1;
  margin-top: 0.25em;
  font-size: 10px;
  text-align: center;
}

#dateDisplay {
  color: #444;
  margin-top: 0.5em;
  font-size: clamp(0.7rem, 2.5vw, 1rem);
  letter-spacing: 0.1em;
  text-align: center;
}

/* ===============================
   設定エリア
=============================== */
.divider {
  border: none;
  border-top: 1px solid #1e1e1e;
  width: 92%;
  margin: 0 auto;
}

#controls {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 5vw 6vw 10vw;
  display: flex;
  flex-direction: column;
  gap: 4vw;
}

@media (orientation: landscape) {
  #controls {
    padding: 5vh 6vw 8vh;
    gap: 3vh;
    max-width: 480px;
  }
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.lbl {
  font-size: clamp(0.72rem, 3vw, 0.9rem);
  color: #555;
  white-space: nowrap;
}

.pills { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: flex-end; }
.pill {
  padding: 0.28rem 0.75rem;
  border: 1px solid #2a2a2a;
  background: #000;
  color: #555;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: clamp(0.65rem, 2.5vw, 0.82rem);
  border-radius: 3px;
  cursor: pointer;
  transition: all .12s;
}
.pill:hover { border-color: #fff; color: #fff; }
.pill.on { background: #fff; border-color: #fff; color: #000; }

.tog { position: relative; width: 48px; height: 26px; cursor: pointer; flex-shrink: 0; }
.tog input { position: absolute; opacity: 0; width: 0; height: 0; }
.tog-track {
  position: absolute; inset: 0; border-radius: 999px;
  background: #1c1c1c; border: 1px solid #2a2a2a;
  transition: background .2s, border-color .2s;
}
.tog input:checked + .tog-track { background: #fff; border-color: #fff; }
.tog-knob {
  position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #3a3a3a; transition: transform .2s, background .2s;
}
.tog input:checked ~ .tog-knob { transform: translateX(22px); background: #000; }
.tog-lbl {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: clamp(0.75rem, 3vw, 0.9rem);
  color: #fff; min-width: 2.4rem; text-align: right;
}

#speakBtn {
  width: 100%; padding: 0.8rem;
  border: 1px solid #fff; background: #000; color: #fff;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: clamp(0.8rem, 3vw, 0.95rem);
  letter-spacing: 0.12em; cursor: pointer; border-radius: 3px;
  transition: all .12s;
}
#speakBtn:hover { background: #fff; color: #000; }
#speakBtn:active { opacity: .6; }

#status {
  text-align: center;
  font-size: clamp(0.62rem, 2.5vw, 0.78rem);
  color: #2a2a2a; min-height: 1rem; letter-spacing: 0.06em;
  transition: color .3s;
}
#status.on  { color: #666; }
#status.spk { color: #fff; }

#scrollHint {
  display: none;
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.65rem;
  color: #333;
  letter-spacing: 0.1em;
  pointer-events: none;
  animation: fadeHint 3s ease forwards;
}
@keyframes fadeHint {
  0%   { opacity: 1; }
  70%  { opacity: 1; }
  100% { opacity: 0; }
}
@media (orientation: landscape) {
  #scrollHint { display: block; }
}
</style>
</head>
<body>

<audio id="bgm" loop preload="auto" style="display:none"></audio>

<div id="forceBg"></div>

<div id="clock">
  <div id="timeDisplay">00:00</div>
  <div id="secDisplay">:00</div>
  <div id="dateDisplay">—</div>
</div>

<hr class="divider">

<div id="controls">
  <div class="row">
    <span class="lbl">自動読み上げ</span>
    <div style="display:flex;align-items:center;gap:.6rem">
      <label class="tog">
        <input type="checkbox" id="autoTog">
        <div class="tog-track"></div>
        <div class="tog-knob"></div>
      </label>
      <span class="tog-lbl" id="togLbl">OFF</span>
    </div>
  </div>

  <div class="row">
    <span class="lbl">読み上げ間隔</span>
    <div class="pills">
      <button class="pill" data-min="1">1分</button>
      <button class="pill" data-min="5">5分</button>
      <button class="pill on" data-min="15">15分</button>
      <button class="pill" data-min="30">30分</button>
      <button class="pill" data-min="60">1時間</button>
    </div>
  </div>

  <button id="speakBtn">今すぐ読み上げ</button>
  <div id="status">—</div>
</div>

<div id="scrollHint">↓ スクロールで設定</div>

<script>
document.documentElement.style.background = '#000';
document.body.style.background = '#000';

const timeEl   = document.getElementById('timeDisplay');
const secEl    = document.getElementById('secDisplay');
const dateEl   = document.getElementById('dateDisplay');
const autoTog  = document.getElementById('autoTog');
const togLbl   = document.getElementById('togLbl');
const speakBtn = document.getElementById('speakBtn');
const statusEl = document.getElementById('status');
const bgm      = document.getElementById('bgm');
const DAYS     = ['日','月','火','水','木','金','土'];

let ivMin  = 15;
let autoOn = false;
let lastKey = '';

// ============================================================
// 【デバイス判定】PC版とスマホ版でファイルを切り替える
// ============================================================
function initAudioSrc() {
  if (!bgm) return;
  
  // 画面の横幅が768px未満、またはタッチ操作可能（スマホ・タブレット）ならスマホ用ファイルを指定
  const isMobile = window.innerWidth < 768 || ('ontouchstart' in window);
  
  if (isMobile) {
    bgm.src = "bgm_sp.mp3"; // スマホ・iPhone用（さらに極小音量に加工したファイル）
  } else {
    bgm.src = "bgm.mp3";    // PC用（現在のいい感じの音量ファイル）
  }
}
// ページ読み込み時に即実行
initAudioSrc();
// ============================================================

function startBgAudio() {
  if (!bgm) return;
  bgm.play().catch(() => {});
}

function stopBgAudio() {
  if (!bgm) return;
  bgm.pause();
  bgm.currentTime = 0;
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && bgm && bgm.paused && autoOn) {
    bgm.play().catch(() => {});
  }
});

function fitText() {
  const parent = document.getElementById('clock');
  const maxW = parent.clientWidth * 0.97;
  const maxH = parent.clientHeight * 0.52;
  let lo = 10, hi = 800;
  while (hi - lo > 1) {
    const mid = (lo + hi) / 2;
    timeEl.style.fontSize = mid + 'px';
    (timeEl.scrollWidth <= maxW && timeEl.offsetHeight <= maxH) ? (lo = mid) : (hi = mid);
  }
  timeEl.style.fontSize = lo + 'px';
  secEl.style.fontSize  = (lo * 0.30) + 'px';
}

function to12h(h24) {
  const h = h24 % 12;
  return h === 0 ? 12 : h;
}

const HOUR_READ = {
  1:'いちじ', 2:'にじ', 3:'さんじ', 4:'よじ', 5:'ごじ',
  6:'ろくじ', 7:'ななじ', 8:'はちじ', 9:'くじ',
  10:'じゅうじ', 11:'じゅういちじ', 12:'じゅうにじ'
};

function hourReading(h12) {
  return HOUR_READ[h12];
}

function toKanji(n) {
  const ones = ['','一','二','三','四','五','六','七','八','九'];
  const tens  = ['','十','二十','三十','四十','五十'];
  if (n < 10) return ones[n];
  const t = Math.floor(n / 10);
  const o = n % 10;
  return (t === 1 ? '十' : tens[t]) + ones[o];
}

const MIN_OVERRIDE = {
   1:'いっぷん',  2:'にふん',    6:'ろっぷん',  8:'はっぷん',
  10:'じゅっぷん', 11:'じゅういっぷん', 16:'じゅうろっぷn', 18:'じゅうはっぷん',
  20:'にじゅっぷん', 21:'にじゅういっぷん', 26:'にじゅうろっぷん', 28:'にじゅうはっぷん',
  30:'さんじゅっぷん', 31:'さんじゅういっぷん', 36:'さんじゅうろっぷん', 38:'さんじゅうはっぷん',
  40:'よんじゅっぷん', 41:'よんじゅういっぷん', 46:'よんじゅうろっぷん', 48:'よんじゅうはっぷん',
  50:'ごじゅっぷん', 51:'ごじゅういっぷん', 56:'ごじゅうろっぷん', 58:'ごじゅうはっぷん'
};

function minKanji(m) {
  if (MIN_OVERRIDE[m]) return MIN_OVERRIDE[m];
  return toKanji(m) + '分';
}

function buildSpeech(d) {
  const h12  = to12h(d.getHours());
  const m    = d.getMinutes();
  const hStr = hourReading(h12);
  if (m === 0) return hStr + '、ちょうどです';
  return hStr + '、' + minKanji(m) + 'です';
}

// 読み上げ処理
function speak(d) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(buildSpeech(d));
  u.lang   = 'ja-JP';
  u.rate   = 0.90;
  u.volume = 1.0; 

  u.onstart = () => {
    statusEl.textContent = '読み上げ中…';
    statusEl.className = 'spk';
  };
  u.onend = u.onerror = () => {
    refreshStatus();
  };
  window.speechSynthesis.speak(u);
}

function nextTime(now) {
  const tot = now.getHours() * 60 + now.getMinutes();
  const nxt = Math.ceil((tot + 1) / ivMin) * ivMin;
  return { h: Math.floor(nxt / 60) % 24, m: nxt % 60 };
}

function refreshStatus() {
  if (!autoOn) { statusEl.textContent = '—'; statusEl.className = ''; return; }
  const { h, m } = nextTime(new Date());
  statusEl.textContent =
    `次の読み上げ: ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  statusEl.className = 'on';
}

function tick() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  
  if (document.visibilityState === 'visible') {
    timeEl.textContent = hh + ':' + mm;
    secEl.textContent  = ':' + ss;
    dateEl.textContent =
      now.getFullYear() + '年' + (now.getMonth()+1) + '月' +
      now.getDate() + '日（' + DAYS[now.getDay()] + '）';
    fitText();
  }

  if (autoOn && now.getSeconds() === 0) {
    const key = hh + ':' + mm;
    if (now.getMinutes() % ivMin === 0 && key !== lastKey) {
      lastKey = key; 
      speak(now);
    }
    refreshStatus();
  }
}

document.querySelectorAll('.pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(q => q.classList.remove('on'));
    p.classList.add('on');
    ivMin = +p.dataset.min;
    lastKey = '';
    refreshStatus();
  });
});

autoTog.addEventListener('change', () => {
  autoOn = autoTog.checked;
  togLbl.textContent = autoOn ? 'ON' : 'OFF';
  lastKey = '';
  if (autoOn) startBgAudio(); else stopBgAudio();
  refreshStatus();
});

speakBtn.addEventListener('click', () => { startBgAudio(); speak(new Date()); });
window.addEventListener('resize', fitText);

window.addEventListener('orientationchange', () => {
  const hint = document.getElementById('scrollHint');
  hint.style.animation = 'none';
  hint.offsetHeight;
  hint.style.animation = '';
  window.scrollTo(0, 0);
});

setInterval(tick, 1000);
tick();
</script>
</body>
</html>
